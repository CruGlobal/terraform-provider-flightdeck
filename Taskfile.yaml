# https://taskfile.dev
version: "3"

vars:
  NAME: flightdeck
  BINARY: terraform-provider-{{.NAME}}

env:
  CGO_ENABLED: "0"

tasks:
  default:
    desc: Run unit tests
    cmds:
      - task: test

  build:
    desc: Build the provider binary
    cmds:
      - go build -o {{.BINARY}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}"

  install:
    desc: Install the provider binary into $GOBIN (or $GOPATH/bin) for use with terraform dev_overrides
    silent: true
    cmds:
      - go install .
      - |
        BIN_DIR="$(go env GOBIN)"
        : "${BIN_DIR:=$(go env GOPATH)/bin}"
        cat <<EOF

        Installed to ${BIN_DIR}/{{.BINARY}}

        Add this to ~/.terraformrc and run terraform without 'terraform init':

          provider_installation {
            dev_overrides {
              "CruGlobal/flightdeck" = "${BIN_DIR}"
            }
            direct {}
          }
        EOF

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go and Terraform files
    cmds:
      - gofmt -s -w -e .
      - terraform fmt -recursive ./examples/

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --tests=false

  test:
    desc: Run unit tests (against the in-process mock Flightdeck API; requires terraform on PATH)
    cmds:
      - go test -count=1 -cover ./...

  vulncheck:
    desc: Report known vulnerabilities reachable from this module (what CI gates on)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  generate:
    desc: Regenerate provider docs from schema (requires terraform on PATH)
    cmds:
      - go generate ./...

  # Acceptance tests run the same test bodies as `task test`, but against a
  # live Flightdeck instead of the mock. They need a dedicated test workspace
  # (they create and delete projects) and a personal access token minted in
  # the Flightdeck UI by a member of that workspace:
  #
  #   FLIGHTDECK_ENDPOINT          — base URL, e.g. https://flightdeck.example.com
  #   FLIGHTDECK_TOKEN             — fd_pat_… token bound to the test workspace
  #   FLIGHTDECK_ACC_MEMBER_USER_ID  — email of an existing workspace member, for
  #                                  the member data source / project_member tests
  testacc:
    desc: Run acceptance tests against a live Flightdeck workspace
    env:
      TF_ACC: "1"
    preconditions:
      - sh: test -n "$FLIGHTDECK_ENDPOINT"
        msg: "FLIGHTDECK_ENDPOINT must be set"
      - sh: test -n "$FLIGHTDECK_TOKEN"
        msg: "FLIGHTDECK_TOKEN must be set"
    cmds:
      - go test -v -cover -count=1 -timeout 60m ./internal/provider/...

  release:snapshot:
    desc: Build a local snapshot release with goreleaser
    cmds:
      - goreleaser release --clean --snapshot
